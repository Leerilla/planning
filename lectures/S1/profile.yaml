profile:
  logic_structure:
    value: hierarchical
    confidence: high
    derivation_source: lecture_tree_analysis
    signals:
      - "### 챕터 3개 상위 개념 (기획의 본질, AI 시대, 출처 검증)"
      - "각 상위 개념 아래 하위 세부 (정의, 사례, 용어, 프로세스)"
      - "위->아래 계층적 깊이 관계"
    hierarchy_depth: 3

  core_visual_kind:
    value: comparison
    confidence: high
    derivation_source: type_distribution
    signals:
      - "comparison 11개 (16.4%)"
      - "process 13개 (19.4%)"
      - "activity 14개 (20.9%)"
      - "comparison + process + activity = 54.8% (우세)"
    signal_dominance: 0.55
    minimum_presence: 1
    type_scores:
      diagram: 0
      comparison: 11
      simulation: 14
      data: 0
    note: "Comparison이 최다 타입(표 비교 다수), process와 simulation도 강함. 복합 구조."

  interactivity_density:
    value: medium
    confidence: medium
    signals:
      - "기본 인터랙티브 (8타입): activity 14 + process 13 + example 9 = 36개"
      - "강사 명시 @interactive/@animation: 0건"
      - "후보 총: ~36건 (54% 이상)"
    range:
      low:
        min: 3
        max: 5
      medium:
        min: 6
        max: 9
      high:
        min: 10
        max: 13
    candidates:
      - value: low
        score: 0
        consequence: "Activity 체크리스트가 모두 static 리스트면"
        rationale: "interactive 구현 불필요"

      - value: medium
        score: 36
        consequence: "Activity 체크리스트 일부만 clickable toggle"
        rationale: "현재 설정 (36 > 9 구간이지만 신뢰도 낮음)"

      - value: high
        score: 36
        consequence: "모든 process/example/activity가 실제 interactive"
        rationale: "36은 고-중 경계, 전체 구현 시"

    requires_decision: true
    decision_note: "Activity 항목 (체크리스트)의 실제 구현 방식 확인 필수"

  tone_strength:
    value: balanced
    confidence: medium
    signals:
      - "강한 톤 (절대/필수/반드시): 4회"
        - "line 29: 기획이 아니다"
        - "line 65: 기능을 정하기 전에 사람과 문제를 정한다"
        - "line 281: 기획을 대신하지 않는다"
        - "line 401: 출처를 검증하지 않으면 사용 불가"
      - "약한 톤 (권장/경험/대체로): 3회"
        - "권장하다" (5개 영역 정리)"
        - "경험이 있다" (시드 예시)
        - "선호하다" (페르소나 해석)

    score:
      strong: 4
      soft: 3

    conditions:
      - if: "lecture.md 단정 키워드 포함 (4회)"
        then: "strong 허용"
      - if: "활동 묶음 체크리스트/워크시트"
        then: "soft 권장 (작업자 심리 고려)"

    candidates:
      - value: strong
        score: 4
        consequence: "단정 명확 (좋은 기획 vs 나쁜 기획, 출처 검증 필수)"
        rationale: "강한 표현 4회가 soft 3회보다 우선"

      - value: balanced
        score: 7
        consequence: "단정 + 활동 조화 (현재값)"
        rationale: "strong 4 ≈ soft 3, 차이 1회 (경계선)"

      - value: soft
        score: 3
        consequence: "활동 중심, 탐색 톤"
        rationale: "활동 묶음 1-3이 전체 38-40%"

    requires_decision: false
    recommended_value: "balanced (현재값 유지, 신뢰도 medium)"

  expected_slide_count:
    value:
      min: 99
      max: 111
    actual: null
    confidence: high
    derivation_source: "auto_mapping (D-032/D-033/D-034 적용: 자동생성 3 + 섹션표지 ~30 + 콘텐츠 ~64)"
    v1_value: "67-69 (섹션 표지 미포함)"
    v2_rationale: "D-033에 따라 모든 ### 섹션에 표지 자동 생성 → 약 30개 추가"
    note: "실측은 자동 매핑 완료 후 count 갱신. mini-cycle 단위: 이론 8 + 실습 9 = 총 17개"

