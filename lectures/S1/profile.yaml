session_specific_decisions:
  flow:
    deductive_only_in:
      - "이론 섹션 (## 이론)"
      - "기획의 본질 개념 정의부터 출처 검증까지 순차적 논리"

    inductive_domains:
      - "실습 섹션 (## 실습)"
      - "활동 묶음 1-3 워크시트 기반 체험"

  content:
    persona_axes:
      - axis: "역할"
        description: "학생 (아이디어 기획자)"

      - axis: "문제"
        description: "1차 가설 부족 (검증 가능한 기획 부족)"

      - axis: "맥락"
        description: "기획의 5단계 프레임 학습 후 워크시트 작성"

    assertions:
      - "기획은 누구·문제·방법 3개 질문의 답"
      - "페르소나에서 출발하면 검증 가능"
      - "5 Whys로 증상에서 진짜 문제로 내려감"
      - "AI는 속도를 바꾸지 품질을 대신 안 함"
      - "출처는 클릭해서 직접 검증 필수"

    assertions_source:
      - lecture.md line 3 (강의 목표)
      - lecture.md line 27-41 (기획 정의)
      - lecture.md line 97-121 (5 Whys)
      - lecture.md line 281-284 (AI의 역할)
      - lecture.md line 401-404 (출처 검증 원칙)

  interactivity:
    density_min: medium
    catalog_min: 4
    note: "activity 14개 + process 13개 최소 교육 기반. 추가 interactive 강화 권장."

    interactive_opportunities:
      - "활동 묶음 1-3: 클릭식 토글 (체크리스트)"
      - "5 Whys 사례: step-by-step reveal"
      - "3단계 검증 프로세스: carousel or interactive diagram"
      - "가설 페르소나: 입력 폼 또는 수정 가능 영역"

analysis_notes:
  - "S1은 강사가 작성한 표준 자료 (호환 모드 적응)"
  - "이론(9 챕터) + 실습(3 활동 + 기타 4)"
  - "모든 ### 헤더를 정확히 분류: 9 chapter + ~21 slide_group"
  - "comparison 비중 높음 (표 비교형 슬라이드)"
  - "실습 섹션 자체가 폐쇄적 워크시트 (S2와 다른 특수성)"

