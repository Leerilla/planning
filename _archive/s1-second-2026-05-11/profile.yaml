# 강사 검토 필요사항 (Gate-1 요약)

다음 3개 항목에 대해 강사 선택이 필요합니다.

## 1. core_visual_kind: diagram vs comparison

- **현황**: 신호 점수 동률 (각 7점)
- **옵션 A (diagram)**: 5단계 사슬, 5 Whys, 검증 흐름 강조 → ChainDiagram/StepGuide 우선
- **옵션 B (comparison)**: 좋은/나쁜 대조, 거짓 패턴, 과거/현재 강조 → Comparison/Warning 우선
- **권고**: 옵션 C (균형) — 둘 다 표현하여 절차+오류 회피 학습 극대화

## 2. interactivity_density: high vs medium

- **현황**: 카운트 10개 (high 범위, 10-13)
- **옵션 A (high)**: 활동과 통합, 이론 덱에서 직접 선택/입력 (10-13 슬라이드)
- **옵션 B (medium)**: 활동 덱 완전 분리, 이론 덱은 시각/설명 중심 (6-9 슬라이드)
- **권고**: 옵션 B (medium) — 활동 섹션(🚀)이 분명하므로 분리 구조 권고

## 3. expected_slide_count: 범위 확정

- **현황**: 공식 계산 31-43장 (base 37 ±15%)
- **옵션 A (하한)**: 31-36장 — 빠른 진도
- **옵션 B (중간)**: 35-40장 — 균형 ✓ **권고**
- **옵션 C (상한)**: 40-43장 — 깊이 강화

